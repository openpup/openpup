name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── CLI binary (cross-platform) ─────────────────────────────────────────────
  cli:
    name: CLI — ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: linux-x86_64
            cli_binary: openpup
            daemon_binary: openpupd
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: darwin-aarch64
            cli_binary: openpup
            daemon_binary: openpupd
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: darwin-x86_64
            cli_binary: openpup
            daemon_binary: openpupd
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows-x86_64
            cli_binary: openpup.exe
            daemon_binary: openpupd.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI and daemon
        run: cargo build --release -p openpup -p openpup-daemon --target ${{ matrix.target }}

      - name: Strip binary (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          strip target/${{ matrix.target }}/release/${{ matrix.cli_binary }}
          strip target/${{ matrix.target }}/release/${{ matrix.daemon_binary }}

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          ARTNAME="openpup-cli-${VERSION}-${{ matrix.artifact_name }}.tar.gz"
          tar czvf "${ARTNAME}" -C "target/${{ matrix.target }}/release" \
            ${{ matrix.cli_binary }} \
            ${{ matrix.daemon_binary }}
          echo "ARTNAME=${ARTNAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.artifact_name }}
          path: ${{ env.ARTNAME }}

  # ── Tauri desktop app ────────────────────────────────────────────────────────
  tauri:
    name: Tauri app — ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
          - platform: darwin-aarch64
            os: macos-14
          - platform: darwin-x86_64
            os: macos-14
          - platform: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'OpenPup ${{ github.ref_name }}'
          releaseBody: |
            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false

  # ── Create GitHub Release ────────────────────────────────────────────────────
  release:
    name: Publish CLI artifacts
    runs-on: ubuntu-latest
    needs: [cli]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download all CLI artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release (CLI tarballs)
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
