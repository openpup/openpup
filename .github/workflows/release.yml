name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: linux-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: darwin-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: strip target/${{ matrix.target }}/release/openpup

      - name: Create tarball
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          cd target/${{ matrix.target }}/release
          tar czvf ../../../openpup-${VERSION}-${{ matrix.artifact_name }}.tar.gz openpup
          cd ../../..
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openpup-${{ matrix.artifact_name }}
          path: target/openpup-${{ env.VERSION }}-${{ matrix.artifact_name }}.tar.gz

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts for upload
        run: |
          find artifacts -type f -name '*.tar.gz' -exec echo {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*.tar.gz
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
