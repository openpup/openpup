name: Android Test Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Android build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 27.0.12077973

jobs:
  android:
    name: Tauri Android (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;${NDK_VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install frontend deps
        run: npm ci

      - name: Initialize Tauri Android project
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: npx tauri android init

      - name: Validate Android release signing secrets
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "Missing required GitHub secret: $var" >&2
              exit 1
            fi
          done

      - name: Configure Android release signing
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p src-tauri/gen/android/keystores
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/keystores/upload-keystore.jks

          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=${GITHUB_WORKSPACE}/src-tauri/gen/android/keystores/upload-keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

          GRADLE_FILE="src-tauri/gen/android/app/build.gradle.kts"

          if ! [ -f "$GRADLE_FILE" ]; then
            echo "Expected Gradle file not found: $GRADLE_FILE" >&2
            exit 1
          fi

          if ! grep -q 'create("release")' "$GRADLE_FILE"; then
            perl -0pi -e 's/buildTypes \{\n/buildTypes {\n    signingConfigs {\n        create("release") {\n            val keystorePropertiesFile = rootProject.file("keystore.properties")\n            if (keystorePropertiesFile.exists()) {\n                val keystoreProperties = java.util.Properties().apply {\n                    java.io.FileInputStream(keystorePropertiesFile).use { load(it) }\n                }\n                storeFile = file(keystoreProperties.getProperty("storeFile"))\n                storePassword = keystoreProperties.getProperty("storePassword")\n                keyAlias = keystoreProperties.getProperty("keyAlias")\n                keyPassword = keystoreProperties.getProperty("keyPassword")\n            }\n        }\n    }\n/s' "$GRADLE_FILE"
          fi

          if ! grep -q 'signingConfig = signingConfigs.getByName("release")' "$GRADLE_FILE"; then
            perl -0pi -e 's/getByName\("release"\) \{\n/getByName("release") {\n            signingConfig = signingConfigs.getByName("release")\n/s' "$GRADLE_FILE"
          fi

          echo "Android release signing configured"

      - name: Build Android artifact
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          if [ "${{ github.event.inputs.build_type || 'debug' }}" = "release" ]; then
            echo "Building Android release artifact"
            npx tauri android build
          else
            echo "Building Android debug APK"
            npx tauri android build --debug
          fi

      - name: Show generated APKs
        run: find src-tauri/gen/android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) | sort

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openpup-android-${{ github.event.inputs.build_type || 'debug' }}
          if-no-files-found: error
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
