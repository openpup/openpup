[package]
name = "openpup-runtime-desktop"
version = "0.1.21"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
dirs = "5"
libloading = "0.8"
openpup-capabilities = { path = "../capabilities" }
openpup-core = { path = "../core" }
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
