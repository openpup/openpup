[package]
name = "openpup"
version = "0.1.19"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "openpup CLI — chat, memory, and skill management from the terminal"

[[bin]]
name = "openpup"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rustyline = { version = "14", features = ["derive"] }
colored = "2"
chrono = "0.4"
async-trait = "0.1"
openpup-core = { path = "../core" }
openpup-runtime-desktop = { path = "../runtime-desktop" }
