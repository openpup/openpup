[package]
name = "openpup-tauri"
version = "0.1.25"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "openpup_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0", features = [] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }
scraper = "0.24"
tempfile = "3"
futures-util = "0.3"
async-trait = "0.1"
dirs = "5"
openpup-core = { path = "../core" }
openpup-runtime-android = { path = "../runtime-android" }
openpup-runtime-desktop = { path = "../runtime-desktop" }
openpup-runtime-ios = { path = "../runtime-ios" }
walkdir = "2"
tar = "0.4"
flate2 = "1"
dotenvy = "0.15"
open = "5"
rmcp = { version = "1.2.0", features = ["client", "reqwest", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi", "local-time"] }
tracing-appender = "0.2"
petgraph = "0.6"
cron = "0.12"
qrcode = "0.14.1"
tauri-plugin-dialog = "2"


[build-dependencies]
tauri-build = { version = "2.0", features = [] }
